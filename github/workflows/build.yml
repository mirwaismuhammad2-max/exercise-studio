name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare app
        run: |
          mkdir -p www/libs
          cp index.html www/index.html
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6 jspdf@2.5.1 xlsx@0.18.5 docx@7.8.2
          cp node_modules/jspdf/dist/jspdf.umd.min.js www/libs/
          cp node_modules/xlsx/dist/xlsx.full.min.js www/libs/
          cp node_modules/docx/build/index.js www/libs/docx.js
          echo '{"appId":"com.mu.exercisestudio","appName":"Exercise Studio","webDir":"www"}' > capacitor.config.json
          npx cap add android
          npx cap sync android
      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ExerciseStudio-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
